name: AI Agent CI/CD Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'copilot-studio/**']
  repository_dispatch:
    types: [trigger-agent-cicd]
  workflow_dispatch:

jobs:
  ci-eval:
    runs-on: ubuntu-latest
    env:
      USE_MOCK_LLM: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run agent schema and eval suite
        env:
          PYTHONPATH: .
        run: python -m pytest -v

  deploy-staging:
    needs: ci-eval
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy agent release artifact
        env:
          AGENT_API_KEY: ${{ secrets.AGENT_API_KEY }}
        run: |
          echo "Deploying commit ${{ github.sha }} to staging environment..."